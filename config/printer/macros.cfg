[respond]

[gcode_macro _CONF]
# 60 mm/s in mm/min
variable_travel_speed: 3600
# 35 mm/s in mm/min
variable_retract_speed: 2100
# 30 mm/s in mm/min
variable_filament_feed_speed: 1800
# 2.5 mm/s in mm/min
variable_filament_prime_speed: 150
gcode:

[gcode_macro START_PRINT]
description: Homing, warming, priming before start
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  {% if params.TOTAL_LAYER %}
    SET_PRINT_STATS_INFO TOTAL_LAYER={params.TOTAL_LAYER}
  {% endif %}
  M140 S{BED_TEMP}  # start bed heating
  G28  ; Home all axis
  G90  ; use absolute coordinates
  M83  ; extruder relative mode
  M190 S{BED_TEMP} ; wait for bed temp to stabilize
  WAIT_BED_SOAK
  G28 Z  ; re-home Z on hot bed
  BED_MESH_CALIBRATE ADAPTIVE=1
  M104 S{EXTRUDER_TEMP}  ; start the nozzle climbing, _LINE_PURGE waits for it
  _LINE_PURGE

[gcode_macro WAIT_BED_SOAK]
description: Wait for the plate to catch up with the bed sensor
gcode:
  {% set bed_soak = printer.configfile.settings.bed_soak %}
  {% set drop = params.DROP|default(bed_soak.settled_drop)|float %}
  M117 Soaking
  # the sensor sits under the plate, so it reads target before the plate does
  TEMPERATURE_WAIT SENSOR="bed_soak" MAXIMUM={drop}
  M117

[gcode_macro END_PRINT]
description: Turn off heaters, fans, motors, present print
# _LINE_PURGE pushes this back before laying its line
variable_retract: 5.0
gcode:
    {% set E = printer["gcode_macro END_PRINT"].retract|float %}
    {% set retract_feed_rate = printer["gcode_macro _CONF"].retract_speed|float %}
    G92 E0  ; reset extruder position
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F{retract_feed_rate}  # tip up into the heat break, where it cannot ooze
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    TURN_OFF_HEATERS
    _PARK_POST_PRINT
    M84  ; motors off
    M107  ; fans off

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set retract_feed_rate = printer["gcode_macro _CONF"].retract_speed|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F{retract_feed_rate}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set retract_feed_rate = printer["gcode_macro _CONF"].retract_speed|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F{retract_feed_rate}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  END_PRINT
  CANCEL_PRINT_BASE

[gcode_macro M600]
description: Change filament with the toolhead somewhere you can reach it
gcode:
    # front-left: nothing below the nozzle to catch what drools
    {% set X = params.X|default(printer.toolhead.axis_minimum.x + 1)|float %}
    {% set Y = params.Y|default(printer.toolhead.axis_minimum.y + 1)|float %}
    {% set lift = params.Z|default(10)|float %}
    # an early-layer change leaves the gantry too low to reach the extruder
    {% set min_change_height = 100 %}
    {% set z_change = [[printer.toolhead.position.z + lift, min_change_height] | max,
                       printer.toolhead.axis_maximum.z] | min %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G90
    G0 Z{z_change} F900
    G0 X{X} Y{Y} F6000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro LOAD_FILAMENT]
description: Feed filament down to the nozzle and prime it
gcode:
  # gears to melt zone on the LGX Lite PRO
  {% set length = params.LENGTH|default(60)|float %}
  {% set prime = params.PRIME|default(25)|float %}
  {% set feed_rate = printer["gcode_macro _CONF"].filament_feed_speed|float %}
  {% set prime_rate = printer["gcode_macro _CONF"].filament_prime_speed|float %}

  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("Pause the print before moving filament")}
  {% elif printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("Nozzle below min_extrude_temp, heat it before loading")}
  {% else %}
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state
    M83
    G1 E{length} F{feed_rate}
    G1 E{prime} F{prime_rate}  # slow enough for the melt to keep up
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Pull filament back clear of the extruder gears
gcode:
  {% set length = params.LENGTH|default(80)|float %}
  {% set tip = params.TIP|default(5)|float %}
  {% set snap = params.SNAP|default(15)|float %}
  # pulled slowly the molten end stretches into a thread that breaks off in the heat break
  {% set snap_rate = 3000 %}
  {% set feed_rate = printer["gcode_macro _CONF"].filament_feed_speed|float %}
  {% set prime_rate = printer["gcode_macro _CONF"].filament_prime_speed|float %}

  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("Pause the print before moving filament")}
  {% elif printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("Nozzle below min_extrude_temp, heat it before unloading")}
  {% else %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
    M83
    G1 E{tip} F{prime_rate}  # soften the tip so it withdraws without a hook
    G1 E-{snap} F{snap_rate}
    G1 E-{length - snap} F{feed_rate}
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  {% endif %}

[gcode_macro _LINE_PURGE]
description: Heat at the purge position, then lay a line beside the print
gcode:
  {% set purge_height = 0.8 %}
  {% set purge_margin = 10 %}  # clearance between the line and the nearest object
  {% set purge_amount = 30 %}  # mm of filament, laid 1:1 along the travel
  {% set flow_rate = 6 %}  # mm3/s
  {% set tip_distance = printer["gcode_macro END_PRINT"].retract|float %}
  {% set snap_retract = 0.5 %}  # enough tension for the travel to break the string
  {% set bed_inset = 5 %}  # the bed lip and its clips start here
  {% set min_margin = 3 %}  # any closer and the line fouls the brim
  {% set travel_height = 5 %}  # clears the mesh's horizontal_move_z
  {% set travel_feed_rate = printer["gcode_macro _CONF"].travel_speed|float %}
  {% set retract_feed_rate = printer["gcode_macro _CONF"].retract_speed|float %}
  {% set target = printer.extruder.target|float %}

  {% set extruder = printer.configfile.settings.extruder %}
  # E advances 1:1 with the travel, so the line is exactly one filament cross-section
  {% set filament_area = 3.14159 * (extruder.filament_diameter / 2) ** 2 %}
  {% set purge_speed = (flow_rate / filament_area * 60) | round | int %}

  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  # unlabelled objects leave no bounds to hug, so fall back to the front-left corner
  {% set purge = namespace(axis='X', x=bed_inset, y=bed_inset, end=bed_inset + purge_amount) %}

  {% if all_points %}
    {% set x_min = all_points | map(attribute=0) | min %}
    {% set x_max = all_points | map(attribute=0) | max %}
    {% set y_min = all_points | map(attribute=1) | min %}
    {% set y_max = all_points | map(attribute=1) | max %}

    # a print reaching the bed edge gets a narrower gap rather than no purge at all
    {% if y_min - min_margin >= bed_inset %}
      {% set purge.axis = 'X' %}
      {% set purge.x = [[(x_min + x_max - purge_amount) / 2, bed_inset] | max, printer.toolhead.axis_maximum.x - purge_amount] | min %}
      {% set purge.y = [y_min - purge_margin, bed_inset] | max %}
      {% set purge.end = purge.x + purge_amount %}
    {% elif x_min - min_margin >= bed_inset %}
      {% set purge.axis = 'Y' %}
      {% set purge.x = [x_min - purge_margin, bed_inset] | max %}
      {% set purge.y = [[(y_min + y_max - purge_amount) / 2, bed_inset] | max, printer.toolhead.axis_maximum.y - purge_amount] | min %}
      {% set purge.end = purge.y + purge_amount %}
    {% else %}
      {% set purge.axis = '' %}
    {% endif %}
  {% endif %}

  {% if extruder.max_extrude_cross_section < filament_area %}
    {action_raise_error('max_extrude_cross_section %.2f is under the %.2fmm2 the line lays'|format(extruder.max_extrude_cross_section, filament_area))}
  {% elif target == 0 %}
    {action_raise_error("Nozzle has no target temperature, nothing to wait for")}
  {% elif purge.axis == '' %}
    {action_raise_error("Print reaches both bed edges, no room for a purge line")}
  {% else %}
    {% set axis_max = printer.toolhead.axis_maximum[purge.axis|lower] %}
    {action_respond_info('Purging %dmm of filament along %s at %.1f, %.1f'|format(purge_amount, purge.axis, purge.x, purge.y))}
    SAVE_GCODE_STATE NAME=LINE_PURGE_state
    G90  # absolute
    M83  # extruder relative
    G0 Z{travel_height}
    G0 X{purge.x} Y{purge.y} F{travel_feed_rate}
    # reach temperature here, so what drools lands on the line and not the print
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target}
    G0 Z{purge_height}
    G1 E{tip_distance} F{purge_speed}  # close the gap the end-of-print retract left
    G1 {purge.axis}{purge.end} E{purge_amount} F{purge_speed}
    G1 E-{snap_retract} F{retract_feed_rate}
    G0 {purge.axis}{[purge.end + 10, axis_max] | min} F{travel_feed_rate}  # snap the string
    # the slicer starts extruding as if primed, so the nozzle cannot stay retracted
    G1 E{snap_retract} F{retract_feed_rate}
    G0 Z{purge_height * 2}
    RESTORE_GCODE_STATE NAME=LINE_PURGE_state
  {% endif %}

[gcode_macro _PARK_POST_PRINT]
description: Safely move toolhead away from the print and present the print
gcode:
  {% set z_distance=50 %}
  {% set travel_feed_rate = printer["gcode_macro _CONF"].travel_speed|float %}
  ; move Z
  G91  ; set relative to current position
  G0 Z{[z_distance, printer.toolhead.axis_maximum.z - printer.toolhead.position.z] | min}
  ; move X-Y (present the print)
  G90 ; set absolute
  G0 X5 Y{printer.toolhead.axis_maximum.y * 0.85} F{travel_feed_rate}
  M400  ; wait for all moves to complete

[gcode_macro GET]
gcode:
  {% set msg = namespace(text='') %}
  {% set target = namespace(source=printer) %}

  {% if params.KEY %}
    {% for attr in params.KEY.split('.') %}
      {% set target.source = target.source[attr] %}
    {% endfor %}
    {% set msg.text = target.source|string %}
  {% else %}
    {% for key in target.source|sort %}
      {% set msg.text = '%s\n%s=%s'|format(msg.text, key, target.source[key]) %}
    {% endfor %}
  {% endif %}

  {action_respond_info(msg.text)}
