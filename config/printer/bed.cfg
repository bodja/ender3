[heater_bed]
# yourDroid Heating Mat 24 V 220 W on a 5mm aluminium table
heater_pin=PD4
sensor_pin=PA6
control=pid
min_temp=0
max_temp=120  # the mat itself goes to 190
sensor_type=Generic 3950  # the mat's own NTC 3950
max_power: 0.65  # for electrical, thermal, and control reasons. can increase to 0.7 with ferrules, to 0.8-1 with external mosfetp
pid_Kp=41.361
pid_Ki=1.010
pid_Kd=423.435

[bed_screws]
screw1: 30, 31
screw2: 30, 201
screw3: 200, 201
screw4: 200, 31

# bed_screws plus the bltouch offsets (+42.4, +6.3), so the probe lands on the screw
[screws_tilt_adjust]
screw_thread: CW-M4
horizontal_move_z: 5
speed: 120
screw1: 72.4, 37.3
screw1_name: front left
screw2: 72.4, 207.3
screw2_name: back left
screw3: 242.4, 207.3
screw3_name: back right
screw4: 242.4, 37.3
screw4_name: front right
