[bltouch]
sensor_pin=^PC4
control_pin=PA4
x_offset=-42.4
y_offset=-6.3
z_offset=0.340
# a second tap catches a stray reading; measured scatter is one z microstep
samples: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position=115, 115  # bed center
speed=20
z_hop=10
z_hop_speed=4

[bed_mesh]
algorithm=bicubic
probe_count=5
mesh_min=10, 5
mesh_max=207, 228
speed=120
horizontal_move_z=5
adaptive_margin=5
# probe position when safe_z_home parks the nozzle at 115, 115
zero_reference_position: 72.6, 108.7
fade_start=1
fade_end=10
