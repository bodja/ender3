- name: Klipper
  hosts: rpi
  vars_files:
    - vars/klipper.yaml
  tasks:
  - name: Install system packages
    ansible.builtin.apt:
      pkg:
        # python cffi
        - python3-dev
        - libffi-dev
        - build-essential
        # kconfig requirements
        - libncurses-dev
        # hub-ctrl
        - libusb-dev
        # AVR chip installation and building
        - avrdude
        - gcc-avr
        - binutils-avr
        - avr-libc
        # ARM chip installation and building
        - stm32flash
        - libnewlib-arm-none-eabi
        - gcc-arm-none-eabi
        - binutils-arm-none-eabi
        - libusb-1.0-0
        - pkg-config
    become: yes

  - name: Download
    ansible.builtin.git:
      repo: '{{ repo }}'
      dest: '{{ dir }}'
      version: '{{ version }}'

  # system python so python3-dev stays the right headers for cffi and chelper
  - name: Create python env for klippy
    ansible.builtin.command: '{{ UV }} venv --python /usr/bin/python3 {{ venv }}'
    args:
      creates: '{{ venv }}/bin/python'

  - name: Install klippy python requirements
    ansible.builtin.command: >-
      {{ UV }} pip sync --python {{ venv }}/bin/python
      {{ dir }}/scripts/klippy-requirements.txt

  - name: Create systemd service file
    ansible.builtin.template:
      src: ../templates/klipper/klipper.service
      dest: '/etc/systemd/system/{{ service_name }}.service'
    become: yes

  - name: 'Enable {{ service_name }}.service'
    ansible.builtin.systemd:
      daemon_reload: true
      name: '{{ service_name }}.service'
      enabled: true
      masked: no
      state: started
    become: yes
