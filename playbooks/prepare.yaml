- name: Prepare
  hosts: rpi
  tasks:
  - name: Upgrade apt packages
    ansible.builtin.apt:
      upgrade: yes
      update_cache: yes
    become: yes

  - name: Install packages
    ansible.builtin.apt:
      pkg:
        - nginx
        - git
        - unzip
        - curl
    become: yes

  - name: Check the installed uv version
    ansible.builtin.command: '{{ UV }} --version'
    register: uv_installed
    changed_when: false
    failed_when: false  # not installed yet is the normal first-run case

  - name: Install uv
    ansible.builtin.shell:
      cmd: curl -LsSf https://astral.sh/uv/{{ UV_VERSION }}/install.sh | sh
    environment:
      # the installer otherwise picks its own dir and UV stops pointing at it
      UV_INSTALL_DIR: '{{ UV | dirname }}'
    when: UV_VERSION not in uv_installed.stdout.split()  # exact field, not a substring

  - name: NGINX configs
    ansible.builtin.template:
      src: '{{ item.src }}'
      dest: '{{ item.dest }}'
    become: yes
    loop:
      - src: ../templates/deps/nginx/conf.d/connection_upgrade.conf
        dest: /etc/nginx/conf.d/connection_upgrade.conf

  - name: 'Make sure "{{ GROUP_NGINX }}" group has permission to /var/www/'
    ansible.builtin.file:
      path: '/var/www'
      group: '{{ GROUP_NGINX }}'
      mode: '0770'
      state: directory
    become: yes

  - name: Disable NGINX default site
    ansible.builtin.file:
      path: /etc/nginx/sites-enabled/default
      state: absent
    become: yes

  - name: 'Add user "{{ USER }}" to nginx group "{{ GROUP_NGINX }}"'
    ansible.builtin.user:
      name: '{{ USER }}'
      groups: '{{ GROUP_NGINX }}'
      append: yes
    become: yes

  - name: 'Prepare directory for printer logs "{{ PRINTER_LOGS_DIR }}"'
    ansible.builtin.file:
      path: '{{ PRINTER_LOGS_DIR }}'
      state: directory
      owner: '{{ USER }}'
    become: yes
