- name: Printer configs
  hosts: rpi
  vars_files:
    - vars/klipper.yaml

  handlers:
  - name: Restart klipper
    ansible.builtin.systemd_service:
      name: '{{ service_name }}.service'
      state: restarted
    become: yes
    when: klipper_unit.stat.exists

  tasks:
  # absent on a first install, where klipper.yaml starts the service afterwards
  - name: Look for the klipper service
    ansible.builtin.stat:
      path: '/etc/systemd/system/{{ service_name }}.service'
    register: klipper_unit

  # before the config, which fails to load if the section is unknown
  - name: Install the klipper extras
    ansible.builtin.copy:
      src: '{{ item }}'
      dest: '{{ dir }}/klippy/extras/'
      mode: '0644'
    # only the sources, so a local __pycache__ cannot reach the pi
    loop: >-
      {{ lookup('ansible.builtin.fileglob',
                playbook_dir + '/../config/klipper-extras/*.py',
                wantlist=True) }}
    notify: Restart klipper

  # flattened because SAVE_CONFIG refuses to overwrite a value set in an include
  - name: Assemble printer.cfg from the config fragments
    ansible.builtin.assemble:
      src: ../config/printer/
      dest: '{{ PRINTER_CONFIG_DIR }}/printer.cfg'
      remote_src: false
    notify: Restart klipper
