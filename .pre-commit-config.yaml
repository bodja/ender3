---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # .ssh/ is gitignored, but an -f or a gitignore edit would leak the key
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-syntax-check
        language: python
        # webcam.yaml needs community.general, so the full ansible package, not ansible-core
        additional_dependencies: ["ansible==11.3.0"]  # keep in sync with install.sh
        pass_filenames: false
        files: ^(playbook\.yaml|inventory\.yaml|ansible\.cfg|playbooks/.*\.yaml)$
        entry: ansible-playbook
        args:
          - --syntax-check
          - -i
          - inventory.yaml
          # inventory templates ansible_host from it; unused by --syntax-check
          - -e
          - rpi_ip=0.0.0.0
          - playbook.yaml
          - playbooks/avrdude.yaml
          - playbooks/firmware.yaml
          - playbooks/webcam.yaml
